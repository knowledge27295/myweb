# This is a workflow to manage the EC2 instance status

name: Start, Stop and Terminate EC2 instance
on:
  workflow_dispatch:
   inputs:
     action:
       description: "Select action"
       required: true
       type: choice
       options:
         - start
         - stop
         - terminate     
jobs:
  Ec2-Control:
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1.7.0
        with:
          aws-region: ap-southeast-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Start EC2 instance
        if: ${{ inputs.action == 'start' }}
        run: |
          echo "Staring EC2"
          aws ec2 start-instances \
            --instance-ids i-006a053237f9c154d \
            --region ap-southeast-1
          echo "Instance started"  
          

      - name: Stop EC2 instance
        if: ${{ inputs.action == 'stop' }}
        run: |
          echo "Stopping EC2 instance"
          aws ec2 stop-instances \
            --instance-ids i-006a053237f9c154d \
            --region ap-southeast-1
          echo "Instance stopped"  

          
      - name: Terminate EC2 instance
        if: ${{ inputs.action == 'terminate' }}
        run: |
          echo "Terminating the EC2 instance"
          aws ec2 terminate-instances \
            --instance-ids i-006a053237f9c154d \
            --region ap-southeast-1
          echo "Instance terminated"  
          
